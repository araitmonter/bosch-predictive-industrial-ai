[project]
name = "bosch-predictive-industrial-ai"
version = "0.2.0"
description = "Bosch Manufacturing Quality Intelligence case study using the public Bosch Production Line Performance dataset."
requires-python = ">=3.9"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [
  ".git",
  ".venv",
  "data",
  "models",
  "artifacts",
  "notebooks",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "UP045"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
